spring.application.name=servidor-gateway

server.port=8080

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Rutas hacia los microservicios (resueltos por nombre en Eureka)
spring.cloud.gateway.server.webflux.routes[0].id=servicio-usuarios
spring.cloud.gateway.server.webflux.routes[0].uri=lb://servicio-usuarios
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**,/api/v1/usuarios/**

spring.cloud.gateway.server.webflux.routes[1].id=servicio-academico
spring.cloud.gateway.server.webflux.routes[1].uri=lb://servicio-academico
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/cursos/**,/api/v1/periodos/**,/api/v1/asignaciones/**,/api/v1/sesiones/**,/api/v1/tareas/**

# CORS centralizado para el frontend Angular
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${FRONTEND_URL:http://localhost:4200}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=3600

management.endpoints.web.exposure.include=health,info,gateway
